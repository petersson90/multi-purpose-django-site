[project]
name = "multi-purpose-django-site"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2,<5.3",
    "pillow>=13.0.0",
]

[dependency-groups]
# Installed by default with `uv sync`. Add dev-only tools here (e.g. ruff).
dev = []

[tool.uv]
# This is a project, not a distributable package: don't build/install it into the venv.
package = false
