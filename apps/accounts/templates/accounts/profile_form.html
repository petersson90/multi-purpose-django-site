{% extends "base.html" %}

{% block title %}Edit profile{% endblock %}

{% block content %}
  <h1>Edit profile</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Save</button>
    <a class="btn btn-outline" href="{% url 'accounts:profile' %}" role="button">Cancel</a>
  </form>
{% endblock %}
